name: APK bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: App-Icon erzeugen
        run: npx capacitor-assets generate --android
      - name: Kamera-Berechtigung eintragen
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Feste Signatur einrichten
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Secrets KEYSTORE_B64 und KEYSTORE_PASSWORD fehlen - APK bekommt einen zufaelligen Debug-Schluessel, Updates ueber die alte App sind dann nicht moeglich."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/kalorien.keystore
          python3 scripts/patch_signing.py
      - name: Versionsnummer hochzaehlen
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          VN=$(grep -o "VERSION_NAME='[^']*'" www/index.html | cut -d"'" -f2)
          sed -i "s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: kalorien-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
