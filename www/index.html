<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
var VERSION=12;
window.__live=0;
(function(){try{
  var l=JSON.parse(localStorage.getItem('liveapp')||'null');
  if(l&&l.v>VERSION&&l.html){
    if(localStorage.getItem('liveboot')===String(l.v)){localStorage.removeItem('liveapp');localStorage.removeItem('liveboot')}
    else{
      localStorage.setItem('liveboot',String(l.v));window.__live=1;
      document.addEventListener('DOMContentLoaded',function(){document.open();document.write(l.html);document.close()});
    }
  }
}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f855a">
<title>Kalorien</title>
<style>
:root{--bg:#f6f7f6;--card:#fff;--tx:#1b1f1c;--mu:#6b746d;--ac:#2f855a;--ln:#e2e6e3;--bad:#c53030}
@media(prefers-color-scheme:dark){:root{--bg:#121513;--card:#1c211e;--tx:#eaeeea;--mu:#8e9a91;--ac:#48bb78;--ln:#2a312c}}
*{box-sizing:border-box}
body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--tx);max-width:560px;margin:auto;padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
button,input,select{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button.g{background:transparent;color:var(--mu);border:1px solid var(--ln)}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.big{font-size:34px;font-weight:700}.mu{color:var(--mu);font-size:14px}
.bar{height:10px;background:var(--ln);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.bar.over i{background:var(--bad)}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--ln)}
.it:first-of-type{border-top:0}
.x{background:none;color:var(--mu);padding:0 6px;font-size:20px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:20px;border-radius:30px;padding:14px 22px;box-shadow:0 4px 14px #0004}
dialog{width:min(540px,96vw);border:0;border-radius:16px;padding:14px;background:var(--card);color:var(--tx);max-height:90vh}
dialog::backdrop{background:#0008}
.res{padding:10px 0;border-top:1px solid var(--ln);cursor:pointer}
video{width:100%;border-radius:10px;margin-top:8px}
.m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.beer{position:fixed;left:max(16px,calc(50% - 264px));bottom:20px;width:54px;height:54px;border-radius:50%;padding:0;background:var(--card);border:1px solid var(--ln);box-shadow:0 4px 14px #0004;display:flex;align-items:center;justify-content:center}
.beer:active{transform:scale(.92)}
.beer{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.beer.mass{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#222;color:#fff;border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;box-shadow:0 4px 14px #0005;z-index:20;max-width:92vw}
#toast[hidden]{display:none}
#toast button{background:none;color:#8fd3a8;padding:0;font-weight:600}
</style>
</head>
<body>
<div class="row sp" style="margin-bottom:12px">
  <button class="g" id="prev">‹</button>
  <div style="text-align:center"><b id="dl"></b></div>
  <button class="g" id="next">›</button>
</div>

<div class="card">
  <div class="row sp"><div><span class="big" id="tot">0</span> <span class="mu">/ <span id="goal"></span> kcal</span></div>
  <div class="row" style="gap:6px"><button class="g" id="stat">Übersicht</button><button class="g" id="setg">Ziel</button></div></div>
  <div class="bar" id="bar"><i></i></div>
  <div class="m mu"><div><b id="p">0</b> g<br>Eiweiß</div><div><b id="c">0</b> g<br>Kohlenhydrate</div><div><b id="f">0</b> g<br>Fett</div></div>
</div>

<div id="list"></div>
<div class="row" style="justify-content:center;margin-top:8px">
  <button class="g" id="exp">Export</button>
  <button class="g" id="imp">Import</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="g" id="upd">Update</button>
</div>
<div class="mu" style="text-align:center;font-size:12px;margin-top:8px"><span id="ver"></span> <span id="ust"></span></div>

<button class="fab" id="add">+ Hinzufügen</button>
<button class="beer" id="beer" aria-label="Bier hinzufügen: Tippen 0,5 l, lang drücken 1 l" title="Tippen: 0,5 l · Lang drücken: 1 l (Maß)">
  <span id="bicon" style="display:flex"><svg viewBox="0 0 24 48" width="18" height="36" aria-hidden="true">
    <rect x="9" y="0" width="6" height="3" rx="1" fill="#9a6b2f"/>
    <path d="M9.5 3h5v10c0 2 3.5 4 3.5 9v22a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V22c0-5 3.5-7 3.5-9z" fill="#e8a317" stroke="#7a4a10" stroke-width="1.2"/>
    <rect x="6.6" y="27" width="10.8" height="11" fill="#fff8e1" opacity=".92"/>
    <path d="M10.5 7v5" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" stroke-linecap="round"/>
  </svg></span>
</button>
<div id="toast" hidden><span id="tmsg"></span><button id="tundo">Rückgängig</button></div>

<dialog id="dlg">
  <div class="row sp"><b>Eintrag hinzufügen</b><button class="x" id="cl">×</button></div>
  <div class="row" style="margin:10px 0">
    <select id="meal"><option>Frühstück</option><option>Mittagessen</option><option>Abendessen</option><option>Snacks</option></select>
  </div>
  <div class="row"><input id="q" placeholder="Produkt oder Barcode suchen" enterkeyhint="search"><button id="go">Suche</button><button class="g" id="scan">📷</button></div>
  <video id="vid" playsinline muted hidden></video>
  <div id="res" class="mu" style="margin-top:8px"></div>
  <div id="pick" hidden>
    <div class="row sp"><b id="pn"></b><button class="x" id="pstar">☆</button></div>
    <div class="row" style="margin:8px 0"><input id="gr" type="number" inputmode="decimal" step="any" value="100"><select id="un" style="width:auto;max-width:62%"></select></div>
    <div class="mu" id="pv"></div>
    <button id="ok" style="width:100%;margin-top:10px">Hinzufügen</button>
  </div>
  <details style="margin-top:12px"><summary class="mu">Manuell eintragen</summary>
    <div style="display:grid;gap:8px;margin-top:8px">
      <input id="mn" placeholder="Name">
      <input id="mk" type="number" inputmode="decimal" placeholder="kcal gesamt">
      <div class="row"><input id="mp" type="number" inputmode="decimal" placeholder="Eiweiß g"><input id="mc" type="number" inputmode="decimal" placeholder="KH g"><input id="mf" type="number" inputmode="decimal" placeholder="Fett g"></div>
      <button id="mok">Hinzufügen</button>
    </div>
  </details>
</dialog>

<dialog id="edlg">
  <div class="row sp"><b>Eintrag bearbeiten</b><button class="x" id="ecl">×</button></div>
  <div style="display:grid;gap:8px;margin-top:10px">
    <input id="en" placeholder="Name">
    <div class="row"><select id="em"></select><input id="edate" type="date"></div>
    <div class="row"><input id="eg" type="number" inputmode="decimal" placeholder="Menge"><span>g</span></div>
    <input id="ek" type="number" inputmode="decimal" placeholder="kcal gesamt">
    <div class="row"><input id="ep" type="number" inputmode="decimal" placeholder="Eiweiß g"><input id="ec" type="number" inputmode="decimal" placeholder="KH g"><input id="ef" type="number" inputmode="decimal" placeholder="Fett g"></div>
    <div class="mu" id="eh"></div>
    <button id="eok">Speichern</button>
  </div>
</dialog>

<dialog id="sdlg">
  <div class="row sp"><b>Übersicht</b><button class="x" id="scl">×</button></div>
  <div class="row" style="margin:10px 0"><button class="stab" data-v="w" style="flex:1">Woche</button><button class="stab g" data-v="m" style="flex:1">Monat</button><button class="stab g" data-v="y" style="flex:1">Jahr</button></div>
  <div class="row sp"><button class="g" id="sp">‹</button><b id="slab" style="text-align:center"></b><button class="g" id="sn">›</button></div>
  <div id="schart"></div>
  <div id="ssum"></div>
</dialog>

<script>
;(function(){
if(window.__live)return;
function boot(){
const $=s=>document.querySelector(s);
let db;try{db=JSON.parse(localStorage.getItem('kt'))}catch(e){}
db=db||{goal:2000,e:[]};db.del=db.del||[];db.gt=db.gt||0;db.items=db.items||{};
const save=()=>{try{localStorage.setItem('kt',JSON.stringify(db))}catch(e){}};
const iso=d=>{const z=new Date(d-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
let day=iso(new Date()),cur=null,stream=null;
const r=n=>Math.round(n*10)/10;
const MEALS=['Frühstück','Mittagessen','Abendessen','Snacks'];

function render(){
  const es=db.e.filter(e=>e.d===day);
  const s=k=>es.reduce((a,e)=>a+e[k],0);
  const t=Math.round(s('k'));
  $('#tot').textContent=t;$('#goal').textContent=db.goal;
  $('#p').textContent=Math.round(s('p'));$('#c').textContent=Math.round(s('c'));$('#f').textContent=Math.round(s('f'));
  $('#bar').className='bar'+(t>db.goal?' over':'');
  $('#bar i').style.width=Math.min(100,t/db.goal*100)+'%';
  $('#dl').textContent=day===iso(new Date())?'Heute':new Date(day).toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'});
  $('#list').innerHTML=MEALS.map(m=>{
    const x=es.filter(e=>e.m===m);if(!x.length)return'';
    return`<div class="card"><h2>${m} · ${Math.round(x.reduce((a,e)=>a+e.k,0))} kcal</h2>`+
    x.map(e=>`<div class="it"><div class="edit" data-e="${e.id}" style="flex:1;cursor:pointer">${esc(e.n)}<div class="mu">${e.u?e.u+' = '+r(e.g)+' g · ':(e.g?e.g+' g · ':'')}${Math.round(e.k)} kcal</div></div><button class="x" data-id="${e.id}">×</button></div>`).join('')+'</div>';
  }).join('')+(es.length?'<div class="mu" style="text-align:center;font-size:12px">Eintrag antippen zum Bearbeiten</div>':'');
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shift=n=>{const d=new Date(day);d.setDate(d.getDate()+n);day=iso(d);render()};
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#list').onclick=e=>{const ed=e.target.closest('.edit');if(ed)return openEdit(ed.dataset.e);
  const id=e.target.dataset.id;if(id){db.e=db.e.filter(x=>String(x.id)!==id);save();render()}};
$('#setg').onclick=()=>{const v=parseInt(prompt('Tagesziel (kcal):',db.goal));if(v>0){db.goal=v;db.gt=Date.now();save();render()}};

function addEntry(o){db.e.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:day,m:$('#meal').value,...o});save();render();closeD()}
function closeD(){stopScan();$('#dlg').close();$('#res').innerHTML='';$('#pick').hidden=true;$('#q').value=''}
$('#add').onclick=()=>{$('#dlg').showModal();showFav()};
$('#cl').onclick=closeD;

const OFF='https://world.openfoodfacts.org';
const FIELDS='code,product_name,brands,nutriments,serving_size,serving_quantity';
function norm(p){
  const n=p.nutriments||{};
  const k=n['energy-kcal_100g']??(n['energy_100g']?n['energy_100g']/4.184:null);
  if(k==null||!p.product_name)return null;
  const nm=p.product_name+(p.brands?' ('+p.brands.split(',')[0]+')':'');
  const sq=parseFloat(p.serving_quantity),sz=(p.serving_size||'').trim();
  const pt=sq>0?[{n:/^[\d.,\s]*(g|ml|gr)?$/i.test(sz)?'Portion':sz,g:sq}]:[];
  return{key:p.code||nm.toLowerCase(),n:nm,k:+k,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,pt};
}
// Offline-Cache: alle gesehenen Produkte bleiben auf dem Handy (max. 500, älteste fliegen zuerst raus)
let cache={};try{cache=JSON.parse(localStorage.getItem('kcache')||'{}')||{}}catch(e){}
function showVer(){$('#ver').textContent='Version '+VERSION+' · '+Object.keys(cache).length+' Produkte offline'}
function remember(list){
  const t=Date.now();list.forEach(x=>{cache[x.key]={...x,t}});
  Object.keys(cache).sort((a,b)=>cache[b].t-cache[a].t).slice(500).forEach(k=>delete cache[k]);
  try{localStorage.setItem('kcache',JSON.stringify(cache))}catch(e){}
  showVer();
}
function localSearch(q){
  const ws=q.toLowerCase().split(/\s+/).filter(Boolean),pool={...cache};
  for(const [k,x] of Object.entries(db.items))if(!pool[k])pool[k]={key:k,...x};
  return Object.values(pool).filter(x=>x.key===q||ws.every(w=>x.n.toLowerCase().includes(w)))
    .sort((a,b)=>(b.t||0)-(a.t||0)).slice(0,20);
}
async function search(){
  const q=$('#q').value.trim();if(!q)return;
  $('#res').textContent='Suche …';$('#pick').hidden=true;
  const isCode=/^\d{8,14}$/.test(q);let list,offline=false;
  if(isCode&&cache[q])list=[cache[q]];
  else{
    const ac=new AbortController(),to=setTimeout(()=>ac.abort(),8000);
    try{
      let items;
      if(isCode){
        const j=await(await fetch(`${OFF}/api/v2/product/${q}.json?fields=${FIELDS}`,{signal:ac.signal})).json();
        items=j.product?[j.product]:[];
      }else{
        const j=await(await fetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=20&fields=${FIELDS}`,{signal:ac.signal})).json();
        items=j.products||[];
      }
      list=items.map(norm).filter(Boolean);remember(list);
    }catch(e){offline=true;list=localSearch(q)}
    clearTimeout(to);
  }
  window._r=list;
  $('#res').innerHTML=(offline?'<div class="mu" style="margin:4px 0">Offline – gespeicherte Produkte</div>':'')+
    (list.length?list.map((x,i)=>`<div class="res" data-i="${i}" style="color:var(--tx)">${esc(x.n)}<div class="mu">${Math.round(x.k)} kcal / 100 g</div></div>`).join(''):
    offline?'Kein gespeichertes Produkt gefunden – ohne Netz bitte unten manuell eintragen.':'Nichts gefunden. Du kannst unten manuell eintragen.');
}
$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};
// Häufig verwendete Artikel und Portionen
let pts=[],sel='g';
const ug=()=>sel==='g'?1:pts[+sel].g;
const ptLabel=x=>/\bg\b|ml/i.test(x.n)?x.n:`${x.n} (${r(x.g)} g)`;
function ensureItem(it){return db.items[it.key]||(db.items[it.key]={n:it.n,k:it.k,p:it.p,c:it.c,f:it.f,pt:[],u:0,t:0,fav:false})}
function showFav(){
  const l=Object.entries(db.items).filter(([k,x])=>x.fav||x.u>0)
    .sort((a,b)=>(b[1].fav-a[1].fav)||(b[1].u-a[1].u)||(b[1].t-a[1].t)).slice(0,12).map(([k,x])=>({key:k,...x}));
  window._r=l;
  $('#res').innerHTML=l.length?'<div class="mu" style="margin:4px 0">Häufig verwendet</div>'+l.map((x,i)=>`<div class="row" style="border-top:1px solid var(--ln)"><div class="res" data-i="${i}" style="flex:1;border:0;color:var(--tx)">${x.fav?'★ ':''}${esc(x.n)}<div class="mu">${Math.round(x.k)} kcal / 100 g${x.u?' · '+x.u+'×':''}</div></div><button class="x" data-rm="${esc(x.key)}">×</button></div>`).join(''):'';
}
function fillUnits(s){
  $('#un').innerHTML='<option value="g">g</option>'+pts.map((x,i)=>`<option value="${i}">${esc(ptLabel(x))}</option>`).join('')+'<option value="+">+ Eigene Portion …</option>';
  $('#un').value=String(s);sel=$('#un').value;
}
function openPick(it){
  cur=it;const st=db.items[it.key];
  pts=[...(it.pt||[]),...((st&&st.pt)||[])].filter((x,i,a)=>a.findIndex(y=>y.n===x.n&&y.g===x.g)===i);
  const li=st&&st.lu&&st.lu!=='g'?pts.findIndex(x=>x.n+'|'+x.g===st.lu):-1;
  fillUnits(li>=0?li:'g');
  $('#gr').value=li>=0?(st.lq||1):(st&&st.lu==='g'&&st.lq?st.lq:100);
  $('#pn').textContent=it.n;$('#pstar').textContent=st&&st.fav?'★':'☆';
  $('#pick').hidden=false;$('#res').innerHTML='';upd();
}
$('#res').onclick=e=>{
  const rm=e.target.dataset.rm;
  if(rm){delete db.items[rm];save();showFav();return}
  const el=e.target.closest('.res');if(!el)return;
  openPick(window._r[el.dataset.i]);
};
function upd(){
  const g=(+$('#gr').value||0)*ug(),f=g/100;
  $('#pv').textContent=(sel==='g'?'':`= ${r(g)} g · `)+`${Math.round(cur.k*f)} kcal · E ${r(cur.p*f)} g · KH ${r(cur.c*f)} g · F ${r(cur.f*f)} g`;
}
$('#gr').oninput=upd;
$('#un').onchange=()=>{
  const v=$('#un').value,prevG=(+$('#gr').value||0)*ug();
  if(v==='+'){
    const n=(prompt('Name der Portion (z. B. 1 Scheibe):','')||'').trim();
    const g=parseFloat((prompt('Gewicht einer Portion in g:','')||'').replace(',','.'));
    if(!n||!(g>0)){$('#un').value=sel;return}
    pts.push({n,g});const st=ensureItem(cur);st.pt=(st.pt||[]).concat({n,g});save();
    fillUnits(pts.length-1);$('#gr').value=1;
  }else{
    sel=v;$('#gr').value=v==='g'?r(prevG):1;
  }
  upd();
};
$('#pstar').onclick=()=>{const st=ensureItem(cur);st.fav=!st.fav;$('#pstar').textContent=st.fav?'★':'☆';save()};
$('#ok').onclick=()=>{
  const q=+$('#gr').value;if(!(q>0))return;
  const g=q*ug(),f=g/100,pt=sel==='g'?null:pts[+sel],st=ensureItem(cur);
  Object.assign(st,{n:cur.n,k:cur.k,p:cur.p,c:cur.c,f:cur.f,pt:pts.slice(),u:st.u+1,t:Date.now(),lu:pt?pt.n+'|'+pt.g:'g',lq:q});
  addEntry({n:cur.n,g:r(g),u:pt?`${r(q)} × ${pt.n}`:'',k:cur.k*f,p:cur.p*f,c:cur.c*f,f:cur.f*f});
};
$('#mok').onclick=()=>{
  const k=+$('#mk').value;if(!k)return;
  addEntry({n:$('#mn').value||'Eintrag',g:0,k,p:+$('#mp').value||0,c:+$('#mc').value||0,f:+$('#mf').value||0});
  ['#mn','#mk','#mp','#mc','#mf'].forEach(s=>$(s).value='');
};

// Barcode-Scanner: nativ (BarcodeDetector, Chrome/Android) oder ZXing-Fallback (iPhone/Safari, Firefox)
let zx=null,zxP=null;
function loadZX(){return zxP||(zxP=new Promise((ok,no)=>{const e=document.createElement('script');e.src='zxing.min.js';e.onload=ok;e.onerror=no;document.head.appendChild(e)}))}
if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)$('#scan').hidden=true;
function stopScan(){
  if(zx){try{zx.reset()}catch(e){}zx=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('#vid').hidden=true;
}
function found(code){navigator.vibrate&&navigator.vibrate(80);$('#q').value=code;stopScan();search()}
$('#scan').onclick=async()=>{
  if(stream||zx)return stopScan();
  const v=$('#vid'),cons={video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}};
  try{
    if('BarcodeDetector' in window){
      stream=await navigator.mediaDevices.getUserMedia(cons);
      v.srcObject=stream;v.hidden=false;await v.play();
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      const loop=async()=>{
        if(!stream)return;
        try{const b=await det.detect(v);if(b.length)return found(b[0].rawValue)}catch(e){}
        setTimeout(loop,250);
      };loop();
    }else{
      $('#res').textContent='Scanner wird geladen …';
      await loadZX();
      const Z=window.ZXing,h=new Map();
      h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
      h.set(Z.DecodeHintType.TRY_HARDER,true);
      zx=new Z.BrowserMultiFormatReader(h,200);
      v.hidden=false;$('#res').textContent='';
      zx.decodeFromConstraints(cons,v,r=>{if(r&&zx)found(r.getText())});
    }
  }catch(e){
    stopScan();
    const n=e&&e.name,m=!window.isSecureContext?'Seite nicht über HTTPS geöffnet.'
      :n==='NotAllowedError'?'Kamera-Erlaubnis verweigert (in den Browser-/Website-Einstellungen erlauben).'
      :n==='NotFoundError'?'Keine Kamera gefunden.'
      :n==='NotReadableError'?'Kamera wird von einer anderen App benutzt.'
      :(e&&e.type==='error')||!window.ZXing&&!('BarcodeDetector' in window)?'Scanner-Bibliothek (zxing.min.js) konnte nicht geladen werden – liegt die Datei neben index.html und läuft der neue Server?'
      :'Fehler: '+(n||e);
    $('#res').textContent=m;
  }
};

// Einträge nachträglich bearbeiten
let ent=null,orig=null;
$('#em').innerHTML=MEALS.map(m=>`<option>${m}</option>`).join('');
function openEdit(id){
  ent=db.e.find(x=>String(x.id)===id);if(!ent)return;
  orig={g:ent.g||0,k:ent.k,p:ent.p,c:ent.c,f:ent.f};
  $('#en').value=ent.n;$('#em').value=ent.m;$('#edate').value=ent.d;
  $('#eg').value=ent.g||'';$('#ek').value=r(ent.k);$('#ep').value=r(ent.p);$('#ec').value=r(ent.c);$('#ef').value=r(ent.f);
  $('#eh').textContent=orig.g?'Ändern der Menge rechnet kcal und Nährwerte automatisch um.':'';
  $('#edlg').showModal();
}
$('#eg').oninput=()=>{
  const v=+$('#eg').value;if(!orig||!orig.g||!v)return;
  const q=v/orig.g;
  $('#ek').value=r(orig.k*q);$('#ep').value=r(orig.p*q);$('#ec').value=r(orig.c*q);$('#ef').value=r(orig.f*q);
};
$('#ecl').onclick=()=>$('#edlg').close();
$('#eok').onclick=()=>{
  const k=parseFloat($('#ek').value),d=$('#edate').value;
  if(!(k>=0)||!d){$('#eh').textContent='Bitte kcal und Datum angeben.';return}
  if((+$('#eg').value||0)!==orig.g)ent.u='';
  Object.assign(ent,{n:$('#en').value.trim()||'Eintrag',m:$('#em').value,d,g:+$('#eg').value||0,k,
    p:+$('#ep').value||0,c:+$('#ec').value||0,f:+$('#ef').value||0});
  save();render();$('#edlg').close();
};

// Auswertung: Woche / Monat / Jahr
let sv='w',sref=new Date();
const pad=n=>String(n).padStart(2,'0');
const D=t=>{const a=t.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}
function buckets(){
  const m={},out=[];
  db.e.forEach(e=>{const a=m[e.d]||(m[e.d]={k:0,p:0,c:0,f:0});a.k+=e.k;a.p+=e.p;a.c+=e.c;a.f+=e.f});
  if(sv==='w'){
    const d0=new Date(sref.getFullYear(),sref.getMonth(),sref.getDate());d0.setDate(d0.getDate()-(d0.getDay()+6)%7);
    for(let i=0;i<7;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);const k=iso(d);out.push({k,l:['Mo','Di','Mi','Do','Fr','Sa','So'][i],a:m[k]?[m[k]]:[]})}
  }else if(sv==='m'){
    const y=sref.getFullYear(),mo=sref.getMonth(),n=new Date(y,mo+1,0).getDate();
    for(let i=1;i<=n;i++){const k=y+'-'+pad(mo+1)+'-'+pad(i);out.push({k,l:[1,5,10,15,20,25,30].includes(i)?i:'',a:m[k]?[m[k]]:[]})}
  }else{
    const y=sref.getFullYear();
    for(let i=0;i<12;i++){const pre=y+'-'+pad(i+1)+'-';out.push({k:pre+'01',l:MON[i],a:Object.keys(m).filter(x=>x.startsWith(pre)).map(x=>m[x])})}
  }
  return out;
}
function renderStats(){
  const b=buckets(),days=b.flatMap(x=>x.a),n=days.length,goal=db.goal;
  const sum=k=>days.reduce((t,x)=>t+x[k],0);
  const vals=b.map(x=>x.a.length?x.a.reduce((t,y)=>t+y.k,0)/x.a.length:0);
  const mx=Math.max(goal*1.15,...vals);
  document.querySelectorAll('.stab').forEach(t=>t.className='stab'+(t.dataset.v===sv?'':' g'));
  let lab;
  if(sv==='w'){const a=D(b[0].k),z=D(b[6].k);lab=`KW ${isoWeek(a)} · ${a.getDate()}.${a.getMonth()+1}. – ${z.getDate()}.${z.getMonth()+1}.${z.getFullYear()}`}
  else if(sv==='m')lab=sref.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  else lab=String(sref.getFullYear());
  $('#slab').textContent=lab;
  $('#schart').innerHTML=`<div style="position:relative;height:150px;display:flex;align-items:flex-end;gap:${sv==='m'?1:4}px;border-bottom:1px solid var(--ln);margin-top:10px">`+
    `<div style="position:absolute;left:0;right:0;bottom:${goal/mx*100}%;border-top:1px dashed var(--mu);pointer-events:none"></div>`+
    b.map((x,i)=>`<div data-k="${x.k}" style="flex:1;height:100%;display:flex;align-items:flex-end;cursor:pointer"><div style="width:100%;height:${vals[i]?Math.max(2,vals[i]/mx*100):0}%;background:${vals[i]>goal?'var(--bad)':'var(--ac)'};border-radius:3px 3px 0 0"></div></div>`).join('')+
    `</div><div style="display:flex;gap:${sv==='m'?1:4}px;font-size:${sv==='m'?10:12}px;color:var(--mu);text-align:center">`+b.map(x=>`<div style="flex:1;min-width:0">${x.l||'&nbsp;'}</div>`).join('')+`</div><div class="mu" style="font-size:12px;margin-top:4px">${sv==='y'?'Ø kcal pro erfasstem Tag je Monat':'kcal pro Tag'} · gestrichelt: Ziel ${goal}</div>`;
  if(!n){$('#ssum').innerHTML='<div class="mu" style="margin-top:12px">Keine Einträge in diesem Zeitraum.</div>';return}
  const N=sv==='w'?7:sv==='m'?b.length:Math.round((new Date(sref.getFullYear()+1,0,1)-new Date(sref.getFullYear(),0,1))/864e5);
  const avg=sum('k')/n,diff=Math.round(avg-goal),ok=days.filter(x=>x.k<=goal).length;
  const ek=sum('p')*4+sum('c')*4+sum('f')*9||1,pc=x=>Math.round(x/ek*100);
  const card=(t,v,sub)=>`<div class="card" style="margin:0;padding:10px"><div class="mu">${t}</div><div style="font-size:20px;font-weight:700">${v}</div>${sub?`<div class="mu">${sub}</div>`:''}</div>`;
  $('#ssum').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">'+
    card('Ø pro Tag',Math.round(avg)+' kcal',(diff>0?'+':'')+diff+' kcal zum Ziel')+
    card('Gesamt',Math.round(sum('k')).toLocaleString('de-DE')+' kcal','')+
    card('Erfasste Tage',n+' / '+N,'')+
    card('Im Ziel',ok+' von '+n+' Tagen','bis '+goal+' kcal')+
    card('Ø Eiweiß',Math.round(sum('p')/n)+' g',pc(sum('p')*4)+' % der Energie')+
    card('Ø Kohlenhydrate',Math.round(sum('c')/n)+' g',pc(sum('c')*4)+' % der Energie')+
    card('Ø Fett',Math.round(sum('f')/n)+' g',pc(sum('f')*9)+' % der Energie')+
    '</div>';
}
function shiftStats(d){
  if(sv==='w')sref=new Date(sref.getFullYear(),sref.getMonth(),sref.getDate()+7*d);
  else if(sv==='m')sref=new Date(sref.getFullYear(),sref.getMonth()+d,1);
  else sref=new Date(sref.getFullYear()+d,0,1);
  renderStats();
}
$('#stat').onclick=()=>{sref=D(day);renderStats();$('#sdlg').showModal()};
$('#scl').onclick=()=>$('#sdlg').close();
$('#sp').onclick=()=>shiftStats(-1);$('#sn').onclick=()=>shiftStats(1);
document.querySelectorAll('.stab').forEach(t=>t.onclick=()=>{sv=t.dataset.v;renderStats()});
$('#schart').onclick=e=>{
  const el=e.target.closest('[data-k]');if(!el)return;
  if(sv==='y'){sref=D(el.dataset.k);sv='m';renderStats()}
  else{day=el.dataset.k;render();$('#sdlg').close()}
};

// Bierflasche: Tippen = 0,5 l, langes Drücken = 1 l (Maßkrug). Richtwert Pils/Helles: ca. 42 kcal je 100 ml
const BOTTLE=$('#bicon').innerHTML,KRUG=`<svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
    <path d="M27 13h3.5a4.5 4.5 0 0 1 4.5 4.5v7a4.5 4.5 0 0 1-4.5 4.5H27" fill="none" stroke="#7a4a10" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M5 9h22l-1.5 24.5a2.5 2.5 0 0 1-2.5 2.3H9a2.5 2.5 0 0 1-2.5-2.3z" fill="#e8a317" stroke="#7a4a10" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M10.5 15v15M15.5 15v15M20.5 15v15" stroke="#fff" stroke-opacity=".38" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="#cdb98f" stroke="#cdb98f" stroke-width="2.4"><circle cx="9.5" cy="8" r="3.6"/><circle cx="16" cy="6" r="4.4"/><circle cx="22.5" cy="8" r="3.6"/><rect x="6" y="8" width="20" height="3"/></g>
    <g fill="#fffaf0"><circle cx="9.5" cy="8" r="3.6"/><circle cx="16" cy="6" r="4.4"/><circle cx="22.5" cy="8" r="3.6"/><rect x="6" y="8" width="20" height="3"/></g>
  </svg>`;
let tt=null,lastBeer=null,lpT=null,lpDone=false,lpBack=null;
function addBeer(l){
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),k=Math.round(420*l);
  db.e.push({id,d:day,m:'Snacks',n:l>=1?'Bier (1 l, Maß)':'Bier (0,5 l)',g:0,u:'',k,p:4*l,c:32*l,f:0});
  save();render();lastBeer=id;
  $('#tmsg').textContent=`🍺 ${l>=1?'1 l':'500 ml'} Bier hinzugefügt (${k} kcal)`;$('#toast').hidden=false;
  clearTimeout(tt);tt=setTimeout(()=>{$('#toast').hidden=true},5000);
}
const lpStart=e=>{
  if(e.button>0)return;
  lpDone=false;clearTimeout(lpT);
  lpT=setTimeout(()=>{
    lpDone=true;
    $('#bicon').innerHTML=KRUG;$('#beer').classList.remove('mass');void $('#beer').offsetWidth;$('#beer').classList.add('mass');
    navigator.vibrate&&navigator.vibrate([40,30,40]);
    addBeer(1);
    clearTimeout(lpBack);lpBack=setTimeout(()=>{$('#bicon').innerHTML=BOTTLE;$('#beer').classList.remove('mass')},1500);
  },500);
};
const lpEnd=()=>clearTimeout(lpT);
$('#beer').addEventListener('pointerdown',lpStart);
['pointerup','pointerleave','pointercancel'].forEach(t=>$('#beer').addEventListener(t,lpEnd));
$('#beer').addEventListener('contextmenu',e=>e.preventDefault());
$('#beer').onclick=()=>{if(lpDone){lpDone=false;return}addBeer(0.5)};
$('#tundo').onclick=()=>{db.e=db.e.filter(x=>x.id!==lastBeer);save();render();$('#toast').hidden=true;clearTimeout(tt)};

// Export / Import
$('#exp').onclick=async()=>{
  const txt=JSON.stringify(db),name='kalorien-'+iso(new Date())+'.json',P=window.Capacitor&&window.Capacitor.Plugins;
  if(P&&P.Filesystem&&P.Share){
    try{
      const w=await P.Filesystem.writeFile({path:name,data:txt,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:name,url:w.uri});return;
    }catch(e){if(e&&/cancel/i.test(String(e.message)))return}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;a.click();
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{
  try{const j=JSON.parse(await e.target.files[0].text());if(Array.isArray(j.e)){db=j;db.items=db.items||{};save();render()}}catch(x){alert('Ungültige Datei')}
};

// Live-Update: holt die neueste index.html aus dem GitHub-Repository und startet damit neu
showVer();
$('#upd').onclick=async()=>{
  const st=$('#ust');
  let repo=localStorage.getItem('krepo');
  if(!repo){
    repo=(prompt('GitHub-Repository für Updates (benutzer/repo):','')||'').trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){st.textContent='· Ungültige Eingabe.';return}
    localStorage.setItem('krepo',repo);
  }
  st.textContent='· Suche Update …';
  try{
    const res=await fetch(`https://raw.githubusercontent.com/${repo}/main/www/index.html?t=${Date.now()}`,{cache:'no-store'});
    if(!res.ok){localStorage.removeItem('krepo');st.textContent='· Repository nicht gefunden (muss öffentlich sein). Nochmal tippen und Adresse prüfen.';return}
    const html=await res.text(),m=html.match(/var VERSION=(\d+)/);
    if(!m||!html.includes('</html>')||!html.includes('id="upd"')){st.textContent='· Datei im Repository ist keine gültige App-Version.';return}
    const v=+m[1];
    if(v<=VERSION){st.textContent='· Bereits aktuell.';return}
    localStorage.setItem('liveapp',JSON.stringify({v,html}));
    st.textContent='· Version '+v+' geladen, starte neu …';
    setTimeout(()=>location.reload(),600);
  }catch(e){st.textContent='· Update fehlgeschlagen (keine Verbindung?).'}
};
render();
try{localStorage.removeItem('liveboot')}catch(e){}
}
boot();
// Falls eine ältere eingebaute Version das Update ins laufende Dokument geschrieben hat: Doppelanzeige entfernen
document.addEventListener('DOMContentLoaded',function(){
  var p=document.querySelectorAll('#prev');
  if(p.length>1){
    var n=p[1].closest('body > *');
    while(n){var nx=n.nextSibling;n.remove();n=nx}
    boot();
  }
});
})();
</script>
